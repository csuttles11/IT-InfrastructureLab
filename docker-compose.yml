services:

  web:
    build:
      context: ./infrastructure/web-server
    container_name: it-lab-web
    ports:
      - "8080:80"
    networks:
      - it-lab-network

  api:
    build:
      context: ./infrastructure/api-server
    container_name: it-lab-api
    ports:
      - "5001:5000"
    networks:
      - it-lab-network

  monitoring:
    build:
      context: ./monitoring
    container_name: it-lab-monitoring
    volumes:
      - ./monitoring/data:/data
    networks:
      - it-lab-network

  monitoring-api:
    build:
      context: ./infrastructure/monitoring-api
    container_name: it-lab-monitoring-api
    ports:
      - "5002:5000"
    volumes:
      - ./monitoring/data:/data
    networks:
      - it-lab-network

  database:
    image: postgres:17-alpine
    container_name: it-lab-database
    environment:
      POSTGRES_DB: itlab
      POSTGRES_USER: itadmin
      POSTGRES_PASSWORD: itlabpassword
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - it-lab-network

networks:
  it-lab-network:
    driver: bridge

volumes:
  postgres-data: